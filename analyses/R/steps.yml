# Explicit render manifest for the RecWaterVirome qproj workflow.
# Authors (display order): Jinlong Ru, Cunli Pan
#
# Lists ONLY implemented steps, in render order. dev/render.R renders them
# in this order, one fresh Quarto/R process each, and every QMD re-validates
# this file in its step-guard chunk. Steps are added here only when they exist
# (2026-09-28: 020-900 added for the full figure set).
#
#   qmd             relative to the project root
#   depends_on      earlier steps whose outputs this step reads
#   project_inputs  version-controlled files (project-root relative) this step reads
#   upstream_inputs files read from earlier steps via path_source(step, file)
#   outputs         files written via path_target(file) into analyses/data/<id>/
#
# Every step additionally writes step-record.json (hashes of its outputs).
# This file is hash-registered in analyses/data/source-checksums.tsv.
version: 1
workflow_dir: analyses

steps:
  - id: 010-input-manifest
    qmd: analyses/010-input-manifest.qmd
    depends_on: []
    project_inputs:
      - analyses/data/source-checksums.tsv   # the register; 010 verifies every file it lists
      - analyses/data/inputs.tsv     # migrated scientific inputs; 010 hashes every staged file
    upstream_inputs: []
    outputs:
      - input-manifest.tsv
      - raw-input-manifest.tsv
      - science-input-status.tsv
      - session-info.txt

  - id: 012-tse-construction
    qmd: analyses/012-tse-construction.qmd
    depends_on: [010-input-manifest]
    project_inputs: [analyses/R/community.yml]
    upstream_inputs:
      - {step: 010-input-manifest, file: input-manifest.tsv}
      - {step: 010-input-manifest, file: raw-input-manifest.tsv}
    outputs:
      - tse_virome.rds
      - tse_16s.rds
      - tse_16s_filtered.rds
      - tse_18s_all.rds
      - tse_18s_microeuk.rds
      - tse-objects.tsv
      - rarefy-record.tsv
      - sqlite-schema.tsv
      - join-report.tsv
      - sample-aliases.tsv
      - tse-checks.tsv
      - session-info.txt

  - id: 020-community-analysis
    qmd: analyses/020-community-analysis.qmd
    depends_on: [010-input-manifest, 012-tse-construction]
    project_inputs: [analyses/R/style.yml, analyses/R/samples.tsv, analyses/R/palettes.yml, analyses/R/definitions.tsv, analyses/R/community-source.yml, analyses/R/community.yml]
    upstream_inputs:
      - {step: 010-input-manifest, file: input-manifest.tsv}
      - {step: 010-input-manifest, file: raw-input-manifest.tsv}
      - {step: 012-tse-construction, file: tse_virome.rds}
      - {step: 012-tse-construction, file: tse_16s.rds}
      - {step: 012-tse-construction, file: tse_16s_filtered.rds}
      - {step: 012-tse-construction, file: tse_18s_all.rds}
      - {step: 012-tse-construction, file: tse_18s_microeuk.rds}
    optional_outputs:    # written only when the rebuilt analysis version is active
      - rng-record.tsv
      - community-provenance.tsv
      - distances.rds
      - pcoa-eigen.tsv
    outputs:
      - community-version.tsv
      - samples.tsv
      - composition_full.tsv
      - taxon_display_map.tsv
      - composition_display.tsv
      - alpha.tsv
      - label_pairs.tsv
      - virome_alpha_detail.tsv
      - pcoa.tsv
      - crossomics.tsv
      - permanova.tsv
      - betadisper.tsv
      - depth.tsv
      - depth_check.tsv
      - host_iphop.tsv
      - host_crispr_edges.tsv
      - host_codetection_by_sample.tsv   # per-sample detail of the Figure 2d co-detection counts (Data 1 S49); 2026-10-10
      - rarefaction_curves.tsv   # read-subsampling curves within the retained count tables (Supplementary Fig. 1c, Data 1 S50); 2026-10-11
      - checkv_catalogue.tsv
      - saturation.tsv
      - community-gaps.tsv
