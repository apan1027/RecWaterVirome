# RecWaterVirome shared figure style.
# Authors (display order): Jinlong Ru, Cunli Pan
#
# Working values from design-v2026.09.27.1 (docs/figure-production-design-2026-09-27/
 # Optional legacy CJK family; current figures use English text.
# journal requirement. Text sizes are in pt (1/72 inch); geometry is physical mm.
# All unit conversions live in R/style.R; export and font checks in R/export.R
# and R/fonts.R. This file is hash-registered in metadata/frozen-files.tsv:
# after a deliberate edit, update its sha256 there and note why.
version: 1

font:
  family: "Arial"                 # all figure text; export aborts if systemfonts cannot resolve it
  cjk_family: "Arial Unicode MS"  # only for explicitly marked CJK strings (style-proof subtitle)

text_pt:
  ordinary: 9                     # axis, legend, strip, caption and direct-label text
  minimum: 8                      # floor for any critical text; exported SVG is checked against it
  title: 10                       # panel titles and figure banner
  tag: 11                         # panel letters, bold
  annotation: 8                   # subtitles, direct data labels and in-panel table text (>= minimum)

figure_text_pt:                   # v39 (2026-10-18): text sizes for the named figures only; every other figure keeps text_pt.
  # Figures 3-5 are full-page grid layouts that the Word build embeds at 159 mm (source width 180 mm). 9.2 pt keeps all
  # their text at >= 8 pt there (9.2 x 159 / 180 = 8.13; measured on the final Word, not assumed) and restores the type
  # size of the reviewed version D (outputs/fig345-visual-review-2026-10-17). Read with rwv_style_for_figure().
  fig3: {ordinary: 9.2, minimum: 9.2, annotation: 9.2}
  fig4: {ordinary: 9.2, minimum: 9.2, annotation: 9.2}
  fig5: {ordinary: 9.2, minimum: 9.2, annotation: 9.2}
  # v40 (2026-10-18): the other six figures, embedded at the same 159 mm Word width, get the same sizes.
  fig1: {ordinary: 9.2, minimum: 9.2, annotation: 9.2}
  fig2: {ordinary: 9.2, minimum: 9.2, annotation: 9.2}
  sfig1: {ordinary: 9.2, minimum: 9.2, annotation: 9.2}
  sfig2: {ordinary: 9.2, minimum: 9.2, annotation: 9.2}
  sfig3: {ordinary: 9.2, minimum: 9.2, annotation: 9.2}
  sfig4: {ordinary: 9.2, minimum: 9.2, annotation: 9.2}

panel_tag:
  case: "lower"                   # displayed panel letters a, b, c (bold, upright; size text_pt$tag). Figure-expression
                                  # revision 2026-10-07; switch to "upper" for a journal that asks for A, B, C. Internal
                                  # panel IDs in plot-values and checks stay A-F (R/figures.R rwv_tag()).

figure_mm:
  width: 180                      # working width; heights are chosen per figure
  margin: 3                       # outer margin of every scientific figure; text must stay >= 2.5 mm from the page edge

line_mm:
  main: 0.3                       # physical stroke width of axes and data lines
  thin: 0.2                       # reference lines (zero, IRR = 1, 95% guide) and outlines of filled marks
  hairline: 0.12                  # tile borders and repel segments
  emphasis: 0.6                   # median marks and site brackets

point_mm:
  sample: 1.6                     # ggplot2 point size for sample points (nominal starting value)
  feature: 0.9                    # dense feature-level points (one point per domain, profile or construct)

colours:
  background: "#FFFFFF"
  text: "#000000"
  strip_fill: "#EFEFEF"
  neutral: ["#000000", "#737373", "#BDBDBD"]  # non-categorical ink only; not a category dictionary
  ink_dark: "#1A1A1A"             # strongest non-black mark
  grey_dark: "#4D4D4D"
  grey_mid: "#737373"
  grey_ref: "#A3A3A3"             # reference lines and connectors
  grey_light: "#BDBDBD"
  grey_rule: "#D9D9D9"            # table rules and zero lines behind points
  grey_pale: "#F0F0F0"

site_colours:                     # encode sampling site only; never reuse for another meaning
  Beijing: "#0072B2"
  Garching: "#E69F00"
  Oberschleissheim: "#009E73"

export:
  png_dpi: 300
  tiff_dpi: 600   # submission TIFF (RGB, LZW), drawn from the same plot object as PDF/SVG/PNG
  pdf_devices: ["cairo_pdf", "quartz_pdf"]  # probed in this order; the first usable one is used
