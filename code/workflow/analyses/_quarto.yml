# Generated by qproj::proj_use_workflow() from the qproj 0.1.5 template
# (templates/_quarto.yml); adapted for RecWaterVirome phase 0: authors,
# cache off, warnings shown, self-contained HTML reports instead of GFM.
# Authors (display order): Jinlong Ru, Cunli Pan
project:
  type: default
  output-dir: "."
  # Writes <step>.md from the knitted Markdown of the single HTML execution
  # (see scripts/gfm-from-knit.R); a second format would execute R again.
  # Only the QMDs are inputs. The Markdown reports (<step>.md) are outputs; if
  # Quarto indexed them as inputs, a preview server would map
  # <step>.html back to <step>.md and, because the .md is written after the
  # .html, re-execute the step when the page is opened (the RStudio Render
  # button then wipes and re-runs the step). It also keeps `quarto render` of
  # the whole project from rendering the reports over the HTML files.
  render:
    - "*.qmd"
    - "!data/"    # migrated raw inputs (for example an archived .qmd document) are data, not steps
  post-render: ../scripts/gfm-from-knit.R

execute:
  # Freeze: Record computational results and re-use them when source files haven't changed.
  # RecWaterVirome keeps freeze and cache off: every render recomputes every chunk.
  freeze: false
  warning: true
  message: true
  echo: false
  error: false

toc: true
toc-float: true
toc-depth: 2
number-sections: false
code-line-numbers: false
code-fold: true
code-tools: true
df-print: paged
reference-location: section
citation-location: document
cache: false

author:
  - name: Jinlong Ru
    orcid: "0000-0002-6757-6018"
  - name: Cunli Pan
    orcid: "0000-0002-2595-7533"

format:
  html:
    embed-resources: true
    # Keep the knitted Markdown so that the post-render hook can derive the
    # GitHub-readable <step>.md (as in SwDGVirome) without executing R again.
    keep-md: true
